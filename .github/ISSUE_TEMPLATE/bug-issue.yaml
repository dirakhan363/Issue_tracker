---
name: "🐞 Bug report"
description: "Report an issue with crDroid Official Blossom"
title: "[BUG] "
labels:
  - bug
  - needs-triage

body:
  - type: markdown
    attributes:
      value: |
        ## 🐞 crDroid Official Blossom Issue Tracker

        This issue tracker is exclusively for **crDroid Official Blossom ROM**.

        **Note:** Unofficial builds are NOT supported because we cannot verify their device-specific source code.

  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type
      options:
        - User interface
        - Feature not working as intended
        - Source code related
        - Other
    validations:
      required: true

  - type: textarea
    id: device
    attributes:
      label: Device
      description: "Specify your device as Device (codename)."
      placeholder: "Xiaomi Redmi 9A (dandelion)"
    validations:
      required: true

  - type: dropdown
    id: rom_version
    attributes:
      label: crDroid version
      description: "Only currently supported source versions are listed."
      options:
        - crDroid 13
    validations:
      required: true

  - type: input
    id: build_version
    attributes:
      label: Exact version / Build date
      description: "Provide the exact ROM version and build date."
      placeholder: "Example: 13.0 / 2026-11-01"
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: Bug description
      description: "Provide a clear and simple description of the issue."
      placeholder: "Describe what is happening..."
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce
      description: "Explain how to reproduce the issue."
      placeholder: |
        1. Go to Settings.
        2. Open the relevant option.
        3. Perform the action.
        4. Observe the issue.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (logcat / dmesg / build log)
      description: |
        Provide logs related to the reported issue.

        - Logcat for framework and application issues.
        - dmesg or kernel logs for kernel and hardware issues.
        - Build logs for compilation issues.

        Please provide complete relevant logs whenever possible.
        Do not provide unrelated logs.
      render: shell
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or videos
      description: "Attach screenshots or videos demonstrating the issue."
      placeholder: "Drag and drop screenshots/videos here."
    validations:
      required: false

  - type: textarea
    id: possible_solution
    attributes:
      label: Possible solution
      description: "If you know the possible cause or have a suggested fix, mention it here."
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: "Provide any additional information that may help investigate the issue."
    validations:
      required: false

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: "Your issue may be closed if you do not meet these requirements."
      options:
        - label: "I understand that unofficial builds are not supported for device-specific issues."
          required: true

        - label: "I am running the latest available officially supported build for my device."
          required: true

        - label: "I have searched existing issues and confirmed that this is not a duplicate."
          required: true

        - label: "I have written a short and informative issue title."
          required: true

        - label: "I have provided all requested information and relevant logs."
          required: true
